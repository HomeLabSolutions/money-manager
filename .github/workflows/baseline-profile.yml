name: Baseline Profile

on:
  pull_request:
    branches: [develop]
    paths:
      - 'baselineprofile/**'
      - 'app/src/main/generated/baselineProfiles/**'
      - 'incomeexpense/ui/src/main/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/scripts/baseline_profile_ci.sh'
      - '.github/workflows/baseline-profile.yml'
  workflow_dispatch:
    inputs:
      generate_profile:
        description: Regenerate profiles before measuring and upload them for review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: baseline-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Profile installation and startup
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Build the isolated release and benchmark APKs
        run: ./gradlew -PbaselineProfile=true :app:assembleBenchmarkRelease :baselineprofile:assembleBenchmarkRelease
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check profile installation and compare None with Partial
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          GENERATE_PROFILE: ${{ inputs.generate_profile || false }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: npx --yes firebase-tools@15.34.0 emulators:exec --only auth --project demo-baseline-profile --config baselineprofile/firebase.json "bash .github/scripts/baseline_profile_ci.sh"
      - name: Save profiles and benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: baseline-profile-results-${{ github.run_attempt }}
          path: |
            app/src/main/generated/baselineProfiles/*.txt
            baselineprofile/build/outputs/connected_android_test_additional_output/**/*.json
            baselineprofile/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 7
      - name: Save traces for failed measurements
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: baseline-profile-traces-${{ github.run_attempt }}
          path: baselineprofile/build/outputs/**/*.perfetto-trace
          if-no-files-found: ignore
          retention-days: 3
