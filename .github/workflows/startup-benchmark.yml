name: Startup benchmark

on:
  workflow_call:
    inputs:
      baseline_ref:
        required: true
        type: string
      candidate_ref:
        required: true
        type: string
      publish_baseline:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Previous application revision, for example develop
        default: develop
        required: true
        type: string
      candidate_ref:
        description: Application revision to compare, for example migration/metro
        default: migration/metro
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  startup:
    name: Startup regression
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Check the threshold and report parser
        run: python3 -m unittest discover -s .github/scripts -p 'startup_benchmark_test.py'
      - name: Build both application revisions with the same harness
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/startup_benchmark.py build \
            --baseline-ref "$BASELINE_REF" --candidate-ref "$CANDIDATE_REF" \
            --output "$RUNNER_TEMP/startup"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure alternating cold-start batches and enforce 5% limit
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          PUBLISH_BASELINE: ${{ inputs.publish_baseline || false }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: python3 .github/scripts/startup_benchmark.py measure --device emulator-5554 --output "$RUNNER_TEMP/startup" --rounds 3 --iterations 15
      - name: Add startup comparison to job summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/startup/comparison.md" ]]; then
            cat "$RUNNER_TEMP/startup/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save results and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: startup-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/startup/comparison.*
            ${{ runner.temp }}/startup/build-info.json
            ${{ runner.temp }}/startup/build-*.log
            ${{ runner.temp }}/startup/baseline-*/*.json
            ${{ runner.temp }}/startup/candidate-*/*.json
            ${{ runner.temp }}/startup/baseline-*/instrumentation.log
            ${{ runner.temp }}/startup/candidate-*/instrumentation.log
            ${{ runner.temp }}/startup/baseline-*/device-logcat.log
            ${{ runner.temp }}/startup/candidate-*/device-logcat.log
          if-no-files-found: error
          retention-days: 7
      - name: Save traces for failed measurements
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: startup-traces-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/startup/baseline-*/*.perfetto-trace
            ${{ runner.temp }}/startup/candidate-*/*.perfetto-trace
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish the successful develop reference for subsequent runs
        if: success() && inputs.publish_baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: startup-baseline
          path: ${{ runner.temp }}/startup/published-baseline/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
