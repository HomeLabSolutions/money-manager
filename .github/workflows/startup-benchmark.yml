name: Startup benchmark

on:
  workflow_call:
    inputs:
      candidate_ref:
        required: true
        type: string
      baseline_ms:
        default: ''
        type: string
      publish_baseline:
        default: false
        type: boolean
      profile_artifact_id:
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Application revision to measure
        default: develop
        required: true
        type: string
      baseline_ms:
        description: One-time signed-out TTID median in ms measured with Partial compilation and a required Baseline Profile
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  startup:
    name: Startup regression
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Read the last published startup baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          INITIAL_BASELINE_MS: ${{ inputs.baseline_ms }}
        run: |
          mkdir -p "$RUNNER_TEMP/published-startup-baseline"
          if gh api "repos/$GITHUB_REPOSITORY/tarball/startup-benchmark-baseline" \
            > "$RUNNER_TEMP/startup-baseline.tar.gz" 2>/dev/null; then
            tar -xzf "$RUNNER_TEMP/startup-baseline.tar.gz" --strip-components=1 \
              -C "$RUNNER_TEMP/published-startup-baseline"
          else
            printf '{}\n' > "$RUNNER_TEMP/published-startup-baseline/measurement.json"
          fi
          python3 .github/scripts/startup_baseline.py \
            --record "$RUNNER_TEMP/published-startup-baseline/measurement.json" \
            --initial-baseline-ms "$INITIAL_BASELINE_MS" --output "$GITHUB_OUTPUT"
      - name: Check the threshold and report parser
        run: python3 -m unittest discover -s .github/scripts -p 'startup_benchmark_test.py'
      - name: Download the profiles used by the release build
        if: inputs.profile_artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ inputs.profile_artifact_id }}
          path: ${{ runner.temp }}/release-baseline-profile
          merge-multiple: true
      - name: Build candidate application with the startup harness
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          BASELINE_REF: ${{ steps.baseline.outputs.baseline_ref }}
          PROFILE_ARTIFACT_ID: ${{ inputs.profile_artifact_id }}
          PUBLISH_BASELINE: ${{ inputs.publish_baseline || false }}
        run: |
          if [[ "$PUBLISH_BASELINE" == 'true' && -z "$PROFILE_ARTIFACT_ID" ]]; then
            echo '::error::A publication gate requires the generated profiles from the release build.'
            exit 1
          fi
          if ! git rev-parse --verify --end-of-options "${CANDIDATE_REF}^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "$CANDIDATE_REF"
          fi
          profile_args=()
          if [[ -n "$PROFILE_ARTIFACT_ID" ]]; then
            profile_args=(--profile-directory "$RUNNER_TEMP/release-baseline-profile")
          fi
          if [[ -n "$BASELINE_REF" ]]; then
            if ! git rev-parse --verify --end-of-options "${BASELINE_REF}^{commit}" >/dev/null 2>&1; then
              git fetch --no-tags origin "$BASELINE_REF"
            fi
            if [[ -d "$RUNNER_TEMP/published-startup-baseline/profiles" ]]; then
              profile_args+=(--baseline-profile-directory "$RUNNER_TEMP/published-startup-baseline/profiles")
            fi
            python3 .github/scripts/startup_benchmark.py build \
              --baseline-ref "$BASELINE_REF" --candidate-ref "$CANDIDATE_REF" \
              --output "$RUNNER_TEMP/startup" "${profile_args[@]}"
          else
            python3 .github/scripts/startup_benchmark.py build-candidate \
              --candidate-ref "$CANDIDATE_REF" --output "$RUNNER_TEMP/startup" "${profile_args[@]}"
          fi
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure with required Baseline Profile and enforce the 5% limit
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          PUBLISH_BASELINE: ${{ inputs.publish_baseline || false }}
          BASELINE_MS: ${{ steps.baseline.outputs.baseline_ms }}
          MEASURE_COMMAND: ${{ steps.baseline.outputs.measure_command }}
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: python3 .github/scripts/startup_benchmark.py "$MEASURE_COMMAND" --device emulator-5554 --output "$RUNNER_TEMP/startup" --rounds 3 --iterations 15
      - name: Add startup comparison to job summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/startup/comparison.md" ]]; then
            cat "$RUNNER_TEMP/startup/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save results and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: startup-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/startup/comparison.*
            ${{ runner.temp }}/startup/build-info.json
            ${{ runner.temp }}/startup/build-*.log
            ${{ runner.temp }}/startup/candidate-*/*.json
            ${{ runner.temp }}/startup/candidate-*/instrumentation.log
            ${{ runner.temp }}/startup/candidate-*/device-logcat.log
            ${{ runner.temp }}/startup/baseline-*/*.json
            ${{ runner.temp }}/startup/baseline-*/instrumentation.log
            ${{ runner.temp }}/startup/baseline-*/device-logcat.log
            ${{ runner.temp }}/published-startup-baseline/measurement.json
            ${{ runner.temp }}/release-baseline-profile/metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Save traces for failed measurements
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: startup-traces-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/startup/candidate-*/*.perfetto-trace
            ${{ runner.temp }}/startup/baseline-*/*.perfetto-trace
          if-no-files-found: ignore
          retention-days: 3
      - name: Save the passing measurement for publication
        if: success() && inputs.publish_baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: startup-baseline-${{ github.run_attempt }}
          path: ${{ runner.temp }}/startup/published-baseline/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
