name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Inject production google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        mkdir -p app/src/release
        echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/release/google-services.json

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Test release version automation
      run: python3 -m unittest discover -s .github/scripts -p '*_test.py'
    - name: Build with Gradle
      run: ./gradlew assembleDebug
    - name: Save debug APK
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: debug-apk-${{ github.run_attempt }}
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - name: Checks
      run: ./gradlew projectHealth ktlintCheck noApiCheck detektCheck check tomlCheck lint
    - name: Tests
      run: ./gradlew test
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: functions/package-lock.json
    - name: Install function dependencies
      run: npm ci --prefix functions
    - name: Test Firebase Function
      run: npm test --prefix functions
