name: Google Play internal testing
run-name: Google Play ${{ inputs.version }} (${{ inputs.publish && 'publish' || 'build only' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version in major.minor.patch.build format, for example 1.4.3.3
        required: true
        type: string
      publish:
        description: Upload the signed AAB to Google Play internal testing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      pr_number: ${{ steps.commit.outputs.pr_number }}
      ci_run_id: ${{ steps.commit.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
      - name: Validate and set app version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/release_version.py "$RELEASE_VERSION" --output "$GITHUB_OUTPUT"
      - name: Check version availability in Google Play
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 .github/scripts/check_play_version.py "$VERSION_CODE"
      - name: Prepare version commit and required CI
        id: commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          if git diff --quiet -- build.gradle.kts; then
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="release/version-$RELEASE_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add build.gradle.kts
          git commit -m "Release app version $RELEASE_VERSION"
          git push origin "$branch"
          source_sha=$(git rev-parse HEAD)
          printf 'Release app version `%s` (`versionCode = %s`).\n\nCreated by the Google Play delivery workflow.\n' \
            "$RELEASE_VERSION" "$VERSION_CODE" > "$RUNNER_TEMP/version-pr.md"
          pr_url=$(gh pr create --base develop --head "$branch" \
            --title "Release app version $RELEASE_VERSION" --body-file "$RUNNER_TEMP/version-pr.md")
          ci_run_id=''
          for attempt in {1..30}; do
            ci_run_id=$(gh run list --workflow android.yml --branch "$branch" --event pull_request \
              --json databaseId,headSha --jq ".[] | select(.headSha == \"$source_sha\") | .databaseId" | head -n 1)
            if [[ -n "$ci_run_id" ]]; then break; fi
            sleep 2
          done
          if [[ -z "$ci_run_id" ]]; then
            echo '::error::Could not find the required CI run for the version commit.'
            exit 1
          fi
          printf 'source_sha=%s\npr_number=%s\nci_run_id=%s\n' \
            "$source_sha" "${pr_url##*/}" "$ci_run_id" >> "$GITHUB_OUTPUT"
          printf 'Version PR: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
          printf 'If CI requests approval, open the version PR and select **Approve workflows to run**.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize app version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          printf 'App version: **%s** · versionCode: **%s**\n' "$RELEASE_VERSION" "$VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Prepare release configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          CURRENCY_API_KEY: ${{ secrets.CURRENCY_API_KEY }}
          GEOCODING_API_KEY: ${{ secrets.GEOCODING_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          required_secrets=(
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
            GOOGLE_SERVICES_JSON MAPS_API_KEY CURRENCY_API_KEY GEOCODING_API_KEY GEOAPIFY_API_KEY
          )
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Configure the $secret_name Actions secret."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/release/google-services.json
          printf '%s\n' \
            "maps_api_key=$MAPS_API_KEY" \
            "currency_api_key=$CURRENCY_API_KEY" \
            "geocoding_api_key=$GEOCODING_API_KEY" \
            "geoapify_api_key=$GEOAPIFY_API_KEY" > keystore.properties
      - name: Build and check release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease test ktlintCheck detektCheck :app:lintRelease \
            --no-configuration-cache --console=plain
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
      - name: Save signed AAB and R8 mapping
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: play-internal-${{ needs.prepare.outputs.version_name }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Remove release configuration
        if: always()
        run: rm -f -- "$RUNNER_TEMP/upload-keystore.jks" keystore.properties app/src/release/google-services.json

  record-version:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Save version in develop after successful checks
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          CI_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            python3 .github/scripts/wait_for_pr_ci.py "$CI_RUN_ID" "$SOURCE_SHA"
            gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$SOURCE_SHA"
            printf 'Version saved in develop via PR #%s.\n' "$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The requested version is already saved in develop.' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: [prepare, build, record-version]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the checked release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.d9tilov.moneymanager
          releaseName: ${{ needs.prepare.outputs.version_code }} (${{ needs.prepare.outputs.version_name }})
          releaseFiles: release/bundle/release/app-release.aab
          mappingFile: release/mapping/release/mapping.txt
          tracks: internal
          status: completed
