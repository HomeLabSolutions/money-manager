name: Google Play internal testing

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Version code greater than every version already uploaded to Google Play
        required: true
        type: string
      publish:
        description: Upload the signed AAB to Google Play internal testing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate version code
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( VERSION_CODE > 2100000000 )); then
            echo "::error::version_code must be an integer between 1 and 2100000000."
            exit 1
          fi
      - name: Check Google Play credentials
        if: inputs.publish
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::Configure the PLAY_SERVICE_ACCOUNT_JSON Actions secret before publishing."
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Prepare release configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          required_secrets=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_SERVICES_JSON MAPS_API_KEY)
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Configure the $secret_name Actions secret."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/src/release/google-services.json
          printf 'maps_api_key=%s\n' "$MAPS_API_KEY" > keystore.properties
      - name: Build and check release
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease test ktlintCheck detektCheck :app:lintRelease \
            -PreleaseVersionCode="$VERSION_CODE" --no-configuration-cache --console=plain
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/mapping/release/mapping.txt
      - name: Save signed AAB and R8 mapping
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: play-internal-${{ inputs.version_code }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove release configuration
        if: always()
        run: rm -f -- "$RUNNER_TEMP/upload-keystore.jks" keystore.properties app/src/release/google-services.json

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the checked release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release
          merge-multiple: true
      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.d9tilov.moneymanager
          releaseFiles: release/bundle/release/app-release.aab
          mappingFile: release/mapping/release/mapping.txt
          tracks: internal
          status: completed
